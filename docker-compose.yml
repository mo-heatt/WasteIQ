services:
  backend:
    build:
      context: ./backend
    environment:
      SHIPMENTS_PATH: /app/data/shipments.json
      CHALLENGE1_STATE_PATH: /app/data/challenge1_bunker_state.json
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
